spring.application.name=AI Copilot

# Configure credentials through environment variables. Never commit real secrets.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/copilot}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JSP view resolver
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Server
server.port=${SERVER_PORT:8080}

# Google Gemini API
ai.api.key=${GEMINI_API_KEY:}
ai.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}
