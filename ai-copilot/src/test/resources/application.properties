spring.datasource.url=jdbc:h2:mem:copilot;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Stub external AI configuration so tests do not need real credentials.
ai.api.key=test-api-key
ai.api.url=https://example.invalid/test-generate-content

# Reduce logging during tests
logging.level.org.springframework=INFO
